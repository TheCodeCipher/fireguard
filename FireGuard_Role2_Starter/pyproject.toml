# Minimal source-tree project metadata for the standalone starter.
# Install a project-approved PyTorch build and pytest in the Python 3.11 environment.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fireguard-role2-starter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch", "PyYAML"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
