# FireGuard Role 2 configuration.
# This uses the documented baseline processed schema for plumbing only.
# `strict_approved` remains false until Role 4 approves Level-A channels.
model:
  name: m1_unet
  in_channels: 40
  out_channels: 1
  base_channels: 8
  depth: 4
  output: logits

channel_schema:
  name: wsts_processed_v1
  status: BASELINE_SCHEMA_DOCUMENTED_NOT_STRICT_APPROVED
  channel_names_source: docs/data_dictionary.md in fireguard-Geospatial-Data-Engineer.zip
  selected_names: null # null selects all 40 for synthetic plumbing; replace with Role 4-approved names
  strict_approved: false

spatial:
  pad_multiple: 32
  pad_side: bottom_right
  evaluation_policy: full_frame_pad_then_unpad
  geometric_augmentation: false

loss:
  name: masked_bce_dice
  bce_weight: 1.0
  dice_weight: 1.0

reproducibility:
  seed: 2026
  deterministic: true

data:
  sample_shape_reference: [1, 40, 288, 224]
  sample_event_reference: fire_21458798
  sample_input_day_reference: '2018-01-06'
  sample_target_day_reference: '2018-01-07'
  real_tensor_path: null # provide when available; metadata is not a tensor
  split_manifest_path: null # inject Role 4's frozen manifest when available
  use_gfs: false
