name: FireGuard ML CI

# INTEGRATION (Prototype): merged from Role 3's workflow (CPU PyTorch install, script syntax
# check) and Role 2's workflow (Python 3.11 as fixed by the project plan, lint and test both
# ml/tests and ml/src/fireguard_ml/tests). Role 2's path filter is kept so docs-only pushes do
# not run the ML job; scripts/ and configs/ are included because the cross-role contract tests
# read configs and the syntax check covers scripts.

on:
  push:
    branches:
      - main
      - "role-*/**"
      - "role*/**"
      - "integration/**"
    paths:
      - "ml/**"
      - "configs/**"
      - "scripts/**"
      - "data/manifests/**"
      - "docs/leakage_audit.csv"
      - ".github/workflows/ml-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ml/**"
      - "configs/**"
      - "scripts/**"
      - "data/manifests/**"
      - "docs/leakage_audit.csv"
      - ".github/workflows/ml-ci.yml"

permissions:
  contents: read

jobs:
  ml-tests:
    name: ML Tests and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/pyproject.toml

      # The CPU wheel is ~200 MB instead of ~2.5 GB with CUDA; the tests never need a GPU.
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install ML package
        working-directory: ml
        run: python -m pip install -e ".[dev,scripts]"

      - name: Run Ruff
        working-directory: ml
        run: python -m ruff check src tests

      # testpaths in ml/pyproject.toml collects ml/tests (Role 2) and the package tests (Roles
      # 1, 3, 4 and the cross-role contract tests). The real-WSTS test skips without data.
      - name: Run automated tests
        working-directory: ml
        run: python -m pytest -v

      - name: Syntax-check the scripts
        run: python -m compileall -q scripts
